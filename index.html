<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A$AD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>The A$AD Protocol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an Obsidian-style workspace — ribbon + navigator tree on desktop, drawer + bottom tabs on phones, breadcrumbs and a command palette, HUD corner details */
:root{
  color-scheme: light;
  --bg:#fdfbfc;
  --panel:#ffffff;
  --ink:#1c1219;
  --muted:#8a7684;
  --line:#f1dbe7;
  --pink:#ff2d8a;
  --pink-soft:#fff0f7;
  --pink-glow:rgba(255,45,138,.18);
  --go:#14a06b;
  --warn:#d98a00;
  --stop:#d93a3a;
  --scrim:rgba(28,18,25,.42);
  --display:"Syncopate","Arial Black",sans-serif;
  --body:"Manrope",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --mm-cyan:#3fd4ff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d0a0c; --panel:#16111a; --ink:#f6eef3; --muted:#a2909c; --line:#2b2028;
  --pink:#ff4d9d; --pink-soft:rgba(255,77,157,.12); --pink-glow:rgba(255,77,157,.26);
  --go:#3ccf91; --warn:#f0a92e; --stop:#ff6b6b; --scrim:rgba(0,0,0,.62); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d0a0c; --panel:#16111a; --ink:#f6eef3; --muted:#a2909c; --line:#2b2028;
  --pink:#ff4d9d; --pink-soft:rgba(255,77,157,.12); --pink-glow:rgba(255,77,157,.26);
  --go:#3ccf91; --warn:#f0a92e; --stop:#ff6b6b; --scrim:rgba(0,0,0,.62); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
main{position:relative;z-index:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:980px;margin:0 auto}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pink);outline-offset:2px}


input[type=range]{touch-action:pan-y}
.view-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,46px);line-height:1.05;margin:12px 0 10px;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--pink)}
h2{font-family:var(--display);font-size:clamp(17px,3.4vw,22px);margin:4px 0 0;letter-spacing:.04em;text-wrap:balance}
h3{margin:0 0 4px;font-size:16px}
.intro{margin:0 0 12px;max-width:64ch}
.how{margin:0 0 16px;max-width:64ch;font-size:14px;background:var(--pink-soft);border-left:3px solid var(--pink);padding:10px 14px}
.how b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);display:block;margin-bottom:2px}
.sub{margin-top:28px}

/* Hero */
.hero{position:relative;padding:24px;background:var(--panel);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px))}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 220px at 85% 0%,var(--pink-glow),transparent 70%)}
.status{display:flex;gap:10px;align-items:center;position:relative;z-index:1}
.status .mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:0 0 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pink);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,138,.5)}70%{box-shadow:0 0 0 10px rgba(255,45,138,0)}100%{box-shadow:0 0 0 0 rgba(255,45,138,0)}}
.lede{max-width:60ch;margin:0;position:relative;z-index:1}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.stats div{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.stats b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);letter-spacing:0}

.spark{margin-top:12px;background:var(--panel);border:1px solid var(--line);padding:16px;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--pink);color:#fff;border:0;padding:10px 14px;cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--ink)}

/* Home tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);padding:16px;cursor:pointer;display:grid;gap:6px;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--pink);transform:translateY(-2px)}
.tile .k{font-family:var(--display);font-size:13px;letter-spacing:.06em}
.tile p{margin:0;font-size:13px;color:var(--muted)}
.tile .n{font-family:var(--mono);font-size:10px;color:var(--pink);letter-spacing:.12em;text-transform:uppercase}

/* Chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--pink) var(--line);-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-padding-inline:16px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chips::-webkit-scrollbar{height:3px}
.chips::-webkit-scrollbar-track{background:var(--line)}
.chips::-webkit-scrollbar-thumb{background:var(--pink)}
@media (min-width:700px){.chips{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-bottom:0;margin-bottom:16px}}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);padding:8px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.filters{display:flex;gap:4px}
.filters button{font-family:var(--mono);font-size:10px;letter-spacing:.1em;border:1px solid var(--line);background:var(--panel);padding:6px 8px;cursor:pointer;color:var(--muted)}
.filters button.on{border-color:var(--pink);color:var(--pink)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--pink);transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.bars{display:flex;gap:2px;align-items:end;height:14px}
.bars i{display:block;width:4px;background:var(--line)}
.bars i.on{background:var(--pink)}
.line{font-size:16px;font-weight:600;margin:0}
.why{font-size:13px;margin:0;opacity:.85}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cue{display:grid;gap:3px;font-size:13px;background:var(--bg);border:1px solid var(--line);padding:8px 10px}
.cue span{font-style:italic}
.next{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.bub{padding:7px 10px;max-width:92%}
.her{background:var(--bg);border:1px solid var(--line);justify-self:start}
.you{background:var(--pink);color:#fff;justify-self:end}
.actions{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.copy{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--ink);padding:6px 10px;cursor:pointer}
.copy:hover{background:var(--ink);color:var(--panel)}
.copy.done{background:var(--pink);border-color:var(--pink);color:#fff}
.del{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:10px;cursor:pointer;letter-spacing:.1em}

.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.rule > b{font-family:var(--display);font-size:12px;color:var(--pink);letter-spacing:.06em;padding-top:3px}
.rule p{margin:0;font-size:14px}
.rule .ex{margin-top:6px;font-style:italic;color:var(--muted)}
.rule .src{margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
.weak{border-left:3px solid var(--muted)} .strong{border-left:3px solid var(--pink)}

/* Signals */
.sig{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);padding:14px 16px;min-width:0}
.sig i{width:10px;height:10px;border-radius:50%;margin-top:6px}
.sig.go i{background:var(--go)} .sig.warn i{background:var(--warn)} .sig.stop i{background:var(--stop)}
.sig p{margin:0;font-size:14px}
.sig .src{margin-top:4px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}

/* Library */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--panel);margin-bottom:16px}
.seg button{border:0;background:none;padding:11px 6px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.book{text-align:left;background:var(--panel);border:1px solid var(--line);padding:0;cursor:pointer;display:grid;grid-template-columns:64px 1fr;min-width:0;transition:border-color .2s,transform .2s}
.book:hover{border-color:var(--pink);transform:translateY(-2px)}
.spine{background:var(--pink);color:#fff;font-family:var(--display);font-size:20px;display:grid;place-items:center;font-weight:700}
.book.alt .spine{background:var(--ink)}
.book.exp .spine{background:var(--pink-soft);color:var(--pink);border-right:1px solid var(--line)}
.book .b{padding:14px;display:grid;gap:4px;min-width:0}
.book .t{font-weight:700;font-size:15px}
.book .a{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.book .h{font-size:13px;margin:0}
.open{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;top:max(40px,env(safe-area-inset-top,0px));z-index:41;background:var(--panel);border-top:3px solid var(--pink);
  overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(32px)}to{transform:none}}
.sheet-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
.sheet-head .inner{display:flex;justify-content:space-between;align-items:center;height:52px;gap:10px}
.sheet .inner.body{max-width:720px;padding-block:20px;display:grid;gap:22px}
.sheet h2{font-size:clamp(20px,4.6vw,28px)}
.sheet section{display:grid;gap:10px}
.sheet .big{font-size:17px;font-weight:500;margin:0;max-width:62ch}
.idea{border-left:2px solid var(--line);padding-left:12px}
.idea h3{font-size:15px}
.idea p{margin:0;font-size:14px;max-width:62ch}
.apply{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.apply li{background:var(--pink-soft);padding:10px 12px;font-size:14px}
.caveat{background:var(--bg);border:1px dashed var(--muted);padding:12px;font-size:13px}
.works{display:flex;gap:6px;flex-wrap:wrap}
.works span{font-size:12px;border:1px solid var(--line);padding:4px 8px}

/* Vault & search */
.add{display:grid;gap:8px;background:var(--panel);border:1px dashed var(--pink);padding:16px;margin-bottom:12px}
.add textarea,.add select,.search input{width:100%;font:inherit;border:1px solid var(--line);padding:10px;background:var(--bg);color:var(--ink)}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.add-row select{flex:1;min-width:0}
.search{margin-bottom:16px}
.search input{font-size:16px;padding:14px;background:var(--panel)}
.empty{font-family:var(--mono);font-size:12px;color:var(--muted);padding:20px;border:1px solid var(--line);background:var(--panel);text-align:center}
.res-h{margin:18px 0 8px}

/* Intimacy points */
.pts{display:grid;gap:12px}
.pt{background:var(--panel);border:1px solid var(--line);padding:18px;display:grid;gap:10px;min-width:0}
.pt-h{display:flex;gap:12px;align-items:baseline}
.pt-h b{font-family:var(--display);font-size:12px;color:var(--pink)}
.pt-h h3{margin:0;font-size:17px}
.pt > p{margin:0;font-size:14.5px;max-width:68ch}
.exb{background:var(--pink-soft);padding:12px 14px;display:grid;gap:8px}
.exr{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:14px;align-items:start}
.exr .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.exr.say{grid-template-columns:78px 1fr auto}
.exr.say span:nth-child(2){font-weight:600}
@media (max-width:480px){.exr,.exr.say{grid-template-columns:1fr}.exr .k{padding-top:0}.exr.say .copy{justify-self:start}}

/* Top bar actions */
.tb-actions{display:flex;gap:6px}
.iconbtn .moon{display:none}
:root[data-theme="dark"] .iconbtn .moon{display:block} :root[data-theme="dark"] .iconbtn .sun{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .iconbtn .moon{display:block} :root:not([data-theme="light"]) .iconbtn .sun{display:none} }

/* Her profiles */
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--panel);padding:10px 12px;margin-bottom:14px}
.privacy svg{flex:0 0 16px;width:16px;height:16px;stroke:var(--pink);fill:none;stroke-width:2;margin-top:2px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{background:var(--panel);border:1px solid var(--line);padding:16px;display:grid;gap:8px;min-width:0}
.pcard .nm{font-family:var(--display);font-size:16px;letter-spacing:.04em}
.meter{height:4px;background:var(--line)} .meter i{display:block;height:100%;background:var(--pink)}
.pmeta{display:flex;gap:6px;flex-wrap:wrap}
.pmeta span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:3px 7px;color:var(--muted)}
.newp{border:1px dashed var(--pink);background:var(--pink-soft);color:var(--pink);display:grid;place-items:center;min-height:140px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.back{background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:8px}
fieldset{border:1px solid var(--line);background:var(--panel);padding:16px;margin:0 0 12px;display:grid;gap:14px;min-width:0}
legend{font-family:var(--display);font-size:13px;letter-spacing:.06em;padding:0 6px}
.fnote{margin:-4px 0 0;font-size:13px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;align-items:start}
.fld{display:grid;gap:6px;min-width:0;align-content:start}
.fld.full{grid-column:1/-1}
.fld label,.fld .fl{font-size:13px;font-weight:700;line-height:1.35}
.fld input[type=text],.fld input[type=date],.fld select,.fld textarea{display:block;width:100%;min-width:0;height:44px;font:inherit;font-size:15px;line-height:1.3;border:1px solid var(--line);border-radius:0;padding:0 12px;background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none}
.fld select{padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.fld textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.fld input::placeholder,.fld textarea::placeholder{color:var(--muted);opacity:.8}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px 32px}
.sl{display:grid;gap:8px;min-width:0}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:22px}
.sl-top label{font-size:14px;font-weight:700}
.sl-right{display:flex;align-items:baseline;gap:8px;flex-shrink:0}
.sl .val{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--pink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sl.unset .val{color:var(--muted)}
.sclear{background:none;border:0;padding:0;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:underline}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer}
.sl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--pink) 0 var(--v),var(--line) var(--v) 100%)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--panel);border:3px solid var(--pink);box-shadow:0 0 0 5px var(--pink-glow)}
.sl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.sl input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--pink)}
.sl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--pink);box-shadow:0 0 0 5px var(--pink-glow)}
.sl.unset input[type=range]::-webkit-slider-runnable-track{background:var(--line)}
.sl.unset input[type=range]::-webkit-slider-thumb{border-color:var(--muted);box-shadow:none}
.sl.unset input[type=range]::-moz-range-progress{background:transparent}
.sl.unset input[type=range]::-moz-range-thumb{border-color:var(--muted);box-shadow:none}
.sl .ends{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sl .ends b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tip-top{display:flex;justify-content:space-between;gap:8px}
.mini{position:relative;height:4px;background:var(--line);margin:6px 0 4px}
.mini i{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--pink);transform:translate(-50%,-50%)}

  {id:"openers", name:"Cold Open", title:"Cold Open",
   intro:"First message to someone you don't know. It should feel like the middle of a conversation, not a pickup line. Make her the main character and give her something fun to talk about.",
   how:"Make her the expert: ask for her opinion, her taste, her story. Pick a creative angle she hasn't been asked a hundred times, keep it easy to answer, and drop a hint of your own answer so it feels like a conversation, not a quiz.",
   lines:[
    ["Her taste",3,"Okay, I need an expert opinion and you look like someone with strong ones. What's a song you could play on repeat for a whole week without getting tired of it?","Flatters her judgment, then asks something easy and personal. Music always comes with a memory, which opens the next topic.",["Probably anything by Tems","Good taste. Which song, and what's the memory attached to it? There's always one."]],
    ["Her world",3,"Your photos have serious 'perfect Sunday' energy. What does your ideal Sunday actually look like, from the moment you wake up?","Turns her profile into a story she gets to tell. 'From the moment you wake up' invites detail, not a one-word answer.",["Sleeping in, then brunch with my girls","Brunch where though? I need to know if your taste matches the energy."]],
    ["Her expertise",4,"Settle something for me: what's the most underrated spot in Joburg? Something tells me you'd know.","Puts her in the role of the local insider. People love recommending their favourite places, and it sets up a date later.",["Have you been to Victoria Yards?","Never. Sell it to me. If you convince me, you're giving the tour."]],
    ["Her secret",4,"You look like you have a hidden talent nobody would ever guess. What is it?","Assumes something interesting about her. She'll want to live up to it, and the answer is always a conversation starter.",["I can cook really well actually","Define 'really well'. I'm going to need proof at some point."]],
    ["Her soundtrack",3,"If a theme song played every time you walked into a room, what would it be? Be honest.","Playful, creative and revealing. Her answer tells you how she sees herself.",["Crazy in Love lol","Confident. I respect it. Do you live up to that entrance?"]],
    ["Her stories",3,"That photo at [place] has a story behind it. I can tell. What happened that day?","Specific to her profile, so it can't be copy-paste. 'I can tell' adds a cold-read edge that makes her want to confirm it.",null],
    ["Her wisdom",3,"Random, but I feel like you'd give good advice. What's the best thing anyone's ever told you that actually stuck?","Asks for something meaningful without being heavy. She feels respected, not just admired.",["Never shrink to make others comfortable","That's powerful. Who told you that?"]],
    ["Her passion",3,"What's something you're really into right now that you could talk about for hours? Mine's night drives with good music.","Your own answer models the energy you want back and makes it a two-way exchange from the start.",null],
    ["Her fantasy",4,"If you could swap lives with anyone for one week, who would it be and what's the first thing you'd do?","Imaginative and fun. The 'first thing you'd do' part reveals what she secretly wants.",["Rihanna. I'd go on a shopping spree","Of course. And what's the first thing you'd buy?"]],

const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const isoToUTC = s => { const [y,m,d]=s.split("-").map(Number); return Date.UTC(y,m-1,d); };

function perf(p){
  const day = Math.min(dayNum(p), dueDays(p));
  const due = CHECK.filter(c=>c.day && c.day<=day);
  const pace = due.length ? Math.round(due.filter(c=>p.checks[c.id]).length/due.length*100) : null;
  const effort = p.log.length ? Math.round(p.log.reduce((a,l)=>a+(+l.me||0),0)/p.log.length*20) : null;
  const herE = p.log.length ? Math.round(p.log.reduce((a,l)=>a+(+l.her||0),0)/p.log.length*20) : null;
  const parts = [pace,effort].filter(v=>v!==null);
  return {pace,effort,her:herE,overall: parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):null};
}
function status(p){
  if(p.outcome==="dating") return ["Dating","pink"];
  if(p.outcome==="ended") return ["Ended","muted"];
  const d=dayNum(p), due=dueDays(p);
  if(d>due) return ["Decision due","stop"];
  const exp = CHECK.filter(c=>c.day && c.day<d).length, done = CHECK.filter(c=>c.day && c.day<d && p.checks[c.id]).length;
  if(done < exp-1) return ["Behind","warn"];
  return ["On track","go"];
}

function weekStart(){ const x=new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x.getTime(); }
function timeline(p){
  const due=dueDays(p), d=Math.max(1,Math.min(dayNum(p),due)), pct=p.outcome?100:Math.round(d/due*100);
  const weeks = Math.round(due/7);
  return `<div class="tline"><div class="tl-track"><i style="width:${pct}%"></i>${Array.from({length:weeks-1},(_,i)=>`<b style="left:${(i+1)/weeks*100}%"></b>`).join("")}</div>
    <div class="tl-weeks" style="grid-template-columns:repeat(${weeks},1fr)">${Array.from({length:weeks},(_,i)=>`<span>Week ${i+1}</span>`).join("")}</div></div>`;
}

    <div class="gobtns"><button class="btn" data-revout="revived">Mark revived</button><button class="btn ghost" data-revout="letgo">Let go</button></div></div>`;

  h += `<div class="rsec">${head("Log what happened","Signals")}<p class="intro">Tap whenever something happens. The flame meter moves with each one.</p>
    <div class="evbtns">${REV_EVENTS.map(([id,t,v])=>`<button class="evb ${v>0?"up":"down"}" data-revev="${id}"><span>${esc(t)}</span><b>${v>0?"+":""}${v}</b></button>`).join("")}</div>
    ${(r.events||[]).length?`<ul class="blist" style="margin-top:12px">${[...r.events].reverse().slice(0,8).map(e=>{const ev=REV_EVENTS.find(x=>x[0]===e.type);return `<li class="row"><span>${esc(e.date)} · ${esc(ev?ev[1]:"")}</span><span class="row" style="gap:10px"><b class="${ev&&ev[2]>0?"up":"down"}">${ev?(ev[2]>0?"+":"")+ev[2]:""}</b><button class="del" data-revevdel="${e.id}">Undo</button></span></li>`;}).join("")}</ul>`:""}</div>`;

  h += `<div class="rsec">${head("The plan",`Phase ${cur.n}: ${cur.name}`)}`;
  REV_PHASES.forEach(ph=>{
    const done=ph.steps.filter(s=>(r.steps||{})[s[0]]).length;
    h += `<div class="ckgroup${ph===cur?" now":""}"><div class="row ck-h"><span class="lbl">${ph.days} · ${ph.name}</span><span class="note">${done}/${ph.steps.length}${ph===cur?" · now":""}</span></div>
      <p class="ph-goal">${esc(ph.goal)}</p>
      ${ph.steps.map(([id,day,t])=>{const on=!!(r.steps||{})[id], late=!on&&d>day&&!r.outcome;
        return `<label class="ck${on?" on":""}"><input type="checkbox" id="rs-${id}" data-rstep="${id}" ${on?"checked":""}><span class="box" aria-hidden="true"></span><span class="ct">${esc(t)}</span><span class="cd${late?" late":""}">${late?"Overdue · ":""}Day ${day}</span></label>`;}).join("")}
      ${ph.lines.length?`<div class="ph-lines"><span class="lbl">Lines for this phase</span><div class="grid">${ph.lines.map(l=>card(l)).join("")}</div></div>`:""}
    </div>`;
  });
  h += `</div>`;
  h += `<div class="rsec">${head("The rules","Saving a dying flame")}<div class="rules">${REV_RULES.map(([t,x,s],i)=>`<div class="rule"><b>${String(i+1).padStart(2,"0")}</b><div><h3>${t}</h3><p>${esc(x)}</p>${s?`<p class="src">${s}</p>`:""}</div></div>`).join("")}</div></div>`;
  h += `<div class="rsec">${head("Outcome","Make the call")}<div class="gobtns">${r.outcome?`<button class="btn ghost" data-revreset="1">Start a new revival</button>`:`<button class="btn" data-revout="revived">Mark revived</button><button class="btn ghost" data-revout="letgo">Let go</button><button class="dangerbtn ${S.delArm==="rev"?"arm":""}" data-revreset="1">${S.delArm==="rev"?"Tap again to reset":"Reset revival"}</button>`}</div></div>`;
  return h;
}

      + `<fieldset><legend>Memories</legend><p class="fnote">Date photos and videos. Saved privately in this browser on this device only.</p>

function herRead(p){
  const pc = filled(p);
  if(pc<10) return `<div class="empty">Fill in a few details on her profile first, especially the personality sliders. The more you add, the sharper the read.</div><div class="row" style="margin-top:12px"><span></span><button class="btn" data-htab="profile">Fill in her profile</button></div>`;
  const a = archetype(p);
  let h = `<p class="intro">Based only on what you've observed (profile ${pc}% complete). Use it as a guide. She's always the final word.</p>`;
  h += a ? `<div class="archetype"><span class="mono">Her type</span><span class="ty">${a[0]}</span><p>${a[1]}</p></div>`
         : `<div class="tip"><span class="tl">Her type</span><p>Set the Introverted ↔ Extroverted and Serious ↔ Playful sliders to reveal her type.</p></div>`;

  const st = SLIDERS.filter(([k])=>p[k]!==undefined);
  if(st.length) h += `<div class="rsec">${head("Personality","How to approach her")}<div class="tips">${st.map(s=>{const [k,lo,hi,tl,th,tm]=s, v=p[k], b=band(v);
    const strong = (v<=20||v>=80) ? "Strongly. " : "";
    return `<div class="tip"><div class="tip-top"><span class="tl">${TRAIT_NAMES[k]} · ${valText(s,v)}</span></div>
      <div class="mini" aria-hidden="true"><i style="left:${v}%"></i></div><p>${b==="mid"?tm:strong+(b==="lo"?tl:th)}</p></div>`;}).join("")}</div></div>`;

  const comm = [];
  if(p.reply&&p.reply!=="Not sure"||p.length&&p.length!=="Not sure"||p.emoji&&p.emoji!=="Not sure"){
    const parts=[p.reply&&p.reply!=="Not sure"?`replies ${p.reply.toLowerCase()}`:"",p.length&&p.length!=="Not sure"?`writes ${p.length.toLowerCase()} messages`:"",p.emoji&&p.emoji!=="Not sure"?`uses emojis ${p.emoji.toLowerCase()}`:""].filter(Boolean).join(", ");
    comm.push(["Her texting baseline",`Normally she ${parts}. Measure everything against this: faster or longer than usual means she's warming up; slower or shorter means she's cooling off.`]);
  }
  if(p.channel&&p.channel!=="Not sure") comm.push(["Her channel",`She prefers ${p.channel.toLowerCase()}. Lean into it. ${p.channel==="Voice notes"?"Send the occasional voice note; your tone does the work.":p.channel==="Calls"?"Suggest a call when the chat is flowing (try the Voice line in Raise Heat).":p.channel==="In person"?"Don't over-text. Get to the date sooner.":"Keep texts sharp and playful."}`]);
  (p.humour||[]).forEach(x=>comm.push([`${x} humour`,HUMOUR_TIPS[x]]));
  if(comm.length) h += `<div class="rsec">${head("Communication","How to talk to her")}<div class="tips">${comm.map(([t,x])=>`<div class="tip"><span class="tl">${esc(t)}</span><p>${esc(x)}</p></div>`).join("")}</div></div>`;

  const heart = [];
  if(p.love&&LOVE_TIPS[p.love]) heart.push([p.love,LOVE_TIPS[p.love]]);
  if(p.stress) heart.push(["When she's stressed",`You noted: "${p.stress}". Respond to that, not to what you'd want. Lower her brakes first (Intimacy › Her Desire).`]);
  if(p.values) heart.push(["What she values",`${p.values}. Show her you share or respect these, through actions more than words.`]);
  if(p.goals) heart.push(["Her dreams",`${p.goals}. Ask about these regularly and support them. A man who believes in her goals stands out.`]);
  if(heart.length) h += `<div class="rsec">${head("Heart","What she needs")}<div class="tips">${heart.map(([t,x])=>`<div class="tip"><span class="tl">${esc(t)}</span><p>${esc(x)}</p></div>`).join("")}</div></div>`;

  const ints = (p.interests||"").split(",").map(s=>s.trim()).filter(Boolean).slice(0,6);
  const T = [x=>`Okay, I need your expert opinion: what's the most underrated thing about ${x}?`, x=>`What got you into ${x} in the first place? I want the real story.`, x=>`If you could spend a whole day on ${x} with no limits, what would it look like?`];
  if(ints.length) h += `<div class="rsec">${head("Conversation","Topics that work on her")}<div class="grid">${ints.map((x,i)=>card([x,3,T[i%3](x),"Built from her interests. Let her be the expert.",null])).join("")}</div></div>`;
  if(p.lights) h += `<div class="rsec">${head("Her hot topics","What lights her up")}<ul class="blist"><li>${esc(p.lights)}</li></ul><p class="intro" style="margin-top:8px">Steer back here when the energy dips.</p></div>`;
  const told = (p.told||"").split("\n").map(s=>s.trim()).filter(Boolean);
  if(told.length) h += `<div class="rsec">${head("Callbacks","Things to bring up")}<p class="intro">Ask a follow-up about one of these this week. Remembering details makes her feel important.</p><ul class="blist">${told.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  if(p.off) h += `<div class="rsec">${head("Avoid","Her turn-offs")}<div class="rules">${sig("stop",[p.off,""])}</div></div>`;

  if(p.stage&&STAGE_TIPS[p.stage]){ const [g,links]=STAGE_TIPS[p.stage];
    h += `<div class="rsec">${head("Next move",esc(p.stage))}<p class="intro">${g}</p><div class="gobtns">${links.map(([v,c,n])=>`<button class="btn ghost" data-go="${v}" ${v==="texts"?`data-chip="${c}"`:`data-ichip="${c}"`}>${n} →</button>`).join("")}</div></div>`;
  }
  const sg = herSign(p);
  if(sg){ const z=ZODIAC[sg];
    h += `<div class="rsec">${head("Star sign",sg)}<div class="tip"><span class="tl">Popular astrology says</span><p>${z[0]} Try: ${z[1]}</p><p class="note">Just for fun. Astrology isn't backed by evidence, so let what you've actually observed lead.</p></div></div>`;
  }
  return h;
}

function card([tag,lvl,text,why,follow,cue0],i,del){
  const cue = cue0 || (follow && follow[2]);
  const isSit = cue && cue.startsWith("(");
  return `<article class="card"><div class="card-top"><span class="tag">${esc(tag)}</span>${bars(lvl)}</div>
  ${cue?`<div class="cue"><span class="lbl">${isSit?"Situation":"She says"}</span><span>${esc(isSit?cue.slice(1,-1):cue)}</span></div>`:""}
  <p class="line">${esc(text)}</p>
  ${why?`<p class="why"><span class="lbl">Why it works</span><br>${esc(why)}</p>`:""}
  ${follow?`<div class="next"><span class="lbl">If she replies</span><span class="bub her">${esc(follow[0])}</span><span class="bub you">${esc(follow[1])}</span></div>`:""}
  <div class="actions"><button class="copy" data-text="${esc(text)}">Copy</button>${del?`<button class="del" data-del="${i}">Remove</button>`:""}</div></article>`;
}

function bookBtn(b,seg){
  const cls = seg==="comm"?"alt":seg==="experts"?"exp":"";

}

function vProgress(){
  if(!profiles.length) return `<section class="prog">${head("Your progress","Nothing tracked yet")}
    <div class="dcard"><p style="margin:0">Add your first connection and this space turns into your live dashboard: deadlines, success rate, performance and what needs your attention today.</p>
    <div class="row" style="margin-top:12px"><span></span><button class="btn" data-go="her" data-newher="1">+ Add a connection</button></div></div></section>`;
  const ws = weekStart();
  const active = profiles.filter(p=>!p.outcome), dating = profiles.filter(p=>p.outcome==="dating"), decided = profiles.filter(p=>p.outcome);
  const newWk = profiles.filter(p=>p.created>=ws).length;
  const perfs = active.map(perf).map(x=>x.overall).filter(v=>v!==null);
  const avg = perfs.length?Math.round(perfs.reduce((a,b)=>a+b,0)/perfs.length):null;
  const rate = decided.length?Math.round(dating.length/decided.length*100):null;
  const att = [];
  profiles.forEach(p=>{
    const nm=esc(p.name||"Unnamed");
    if(p.rev&&p.rev.start&&!p.rev.outcome){ const f=revFlame(p.rev).now, d=revDay(p.rev); att.push({w: d>REV_DAYS?95:60-f/2, id:p.id, tab:"revival", cls:f>=50?"go":f>=25?"warn":"stop", t:`${nm}: revival day ${Math.min(d,REV_DAYS)} of ${REV_DAYS}`, s:`Flame ${f}% · ${flameLabel(f)}${d>REV_DAYS?" · time to decide":""}`}); }
    if(p.outcome) return;
    const d=dayNum(p), due=dueDays(p);
    if(d>due) att.push({w:100,id:p.id,tab:"tracker",cls:"stop",t:`${nm}: decision due`,s:`Her ${due/7}-week window ended ${d-due} day${d-due===1?"":"s"} ago`});
    const over = CHECK.filter(c=>c.day && c.day<d && !p.checks[c.id]);
    if(over.length) att.push({w:70+Math.min(over.length,10),id:p.id,tab:"tracker",cls:"warn",t:`${nm}: ${over.length} overdue milestone${over.length>1?"s":""}`,s:`Next up: ${over[0].t}`});
    else if(d<=due && due-d<=4) att.push({w:50,id:p.id,tab:"tracker",cls:"warn",t:`${nm}: ${due-d} day${due-d===1?"":"s"} left`,s:"Close the date before the window ends"});
  });
  if(newWk<WEEKLY_TARGET) att.push({w:40,go:"her",cls:"warn",t:`${WEEKLY_TARGET-newWk} more new connection${WEEKLY_TARGET-newWk>1?"s":""} this week`,s:`You've added ${newWk} of ${WEEKLY_TARGET}`});
  att.sort((a,b)=>b.w-a.w);
  const logs = profiles.flatMap(p=>(p.log||[]).map(l=>({...l,name:p.name||"Unnamed",id:p.id}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const sorted=[...active].sort((a,b)=>(dueDays(a)-dayNum(a))-(dueDays(b)-dayNum(b)));
  return `<section class="prog">${head("Your progress",`${active.length} active · ${dating.length} dating`)}
  <div class="dash">
    <div class="dcard wide"><div class="row"><span class="lbl">New this week</span>${pill(newWk>=WEEKLY_TARGET?["Target hit","go"]:["Target "+WEEKLY_TARGET,"warn"])}</div>
      <div class="big-n">${newWk}<small>/ ${WEEKLY_TARGET}</small></div><div class="slots">${Array.from({length:WEEKLY_TARGET},(_,i)=>`<i class="${i<Math.min(newWk,WEEKLY_TARGET)?"on":""}"></i>`).join("")}</div></div>
    <div class="dcard"><span class="lbl">Success rate</span><div class="big-n">${rate===null?"—":rate+"%"}</div><span class="note">${dating.length} of ${decided.length} decided</span></div>
    <div class="dcard"><span class="lbl">Performance</span><div class="big-n">${avg===null?"—":avg+"%"}</div><div class="meter"><i style="width:${avg||0}%"></i></div></div>
    <div class="dcard"><span class="lbl">Total</span><div class="big-n">${profiles.length}</div><span class="note">${decided.length-dating.length} ended</span></div>
  </div>
  <div class="pgrid">
    <div class="pcol"><span class="lbl">Needs your attention</span>
      ${att.length?`<div class="att">${att.slice(0,6).map(a=>`<button class="attrow" ${a.id?`data-her="${a.id}" data-hopen="${a.tab}"`:`data-go="${a.go}"`}><i class="dotc ${a.cls}" aria-hidden="true"></i><span><b>${a.t}</b><span class="note">${a.s}</span></span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div>`
      :`<div class="empty">All clear. Everything's on track.</div>`}</div>
    <div class="pcol"><span class="lbl">Pipeline at a glance</span>
      ${sorted.length?`<div class="att">${sorted.slice(0,6).map(p=>{const st=status(p),d=dayNum(p),due=dueDays(p);return `<button class="attrow" data-her="${p.id}" data-hopen="tracker"><span class="glance"><span class="row"><b>${esc(p.name||"Unnamed")}</b>${pill(st)}</span>${starRow(p.stars||0,"sm")}<span class="mini2"><i style="width:${Math.round(Math.min(d,due)/due*100)}%"></i></span><span class="note">Day ${Math.min(d,due)} of ${due}</span></span><span class="chev" aria-hidden="true">›</span></button>`;}).join("")}</div>`
      :`<div class="empty">No active connections.</div>`}</div>
  </div>
  ${logs.length?`<div class="rsec" style="margin-top:14px"><span class="lbl">Recent activity</span><ul class="blist" style="margin-top:8px">${logs.map(l=>`<li class="row"><span>${esc(l.date)} · <b>${esc(l.name)}</b> · ${esc(l.type)}</span><span class="note">Effort ${l.me}/5 · Her ${l.her}/5</span></li>`).join("")}</ul></div>`:""}
  </section>`;
}

try{ LK.fails=+localStorage.getItem("asad-fails")||0; LK.until=+localStorage.getItem("asad-until")||0; localStorage.removeItem("asad-pin"); }catch(e){}
function saveFails(){ try{ localStorage.setItem("asad-fails",LK.fails); localStorage.setItem("asad-until",LK.until); }catch(e){} }
const pinStored = () => true;
async function hashPin(pin){
  const txt = "asad-protocol::"+pin;
  try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const c of txt) h=((h<<5)+h+c.charCodeAt(0))|0; return "f"+(h>>>0).toString(16); }
}
async function pinOK(pin){ const h=await hashPin(pin); return h===PIN_HASH || h===PIN_HASH_ALT;
}
function setLocked(on){
  document.body.classList.toggle("locked", !!on);
  ["#app",".tabbar","#palette","#status"].forEach(sel=>{ const el=document.querySelector(sel); if(el){ if(on) el.setAttribute("inert",""); else el.removeAttribute("inert"); }});
  if(typeof playerUI==="function") setTimeout(playerUI,0);
  if(on){ if(!document.body.dataset.sy) document.body.dataset.sy=String(window.scrollY||0); if(typeof closePal==="function") closePal(); if(typeof setSide==="function") setSide(false); }
  else { const y=+(document.body.dataset.sy||0); delete document.body.dataset.sy; requestAnimationFrame(()=>window.scrollTo(0,y)); }
}
function renderLock(){
  const L=$("lock"); if(!L) return;
  const wait = LK.until>Date.now() ? Math.ceil((LK.until-Date.now())/1000) : 0;
  const left = MAX_TRIES-LK.fails;
  const mm = wait ? `${Math.floor(wait/60)}:${String(wait%60).padStart(2,"0")}` : "";
  L.querySelector(".lk-body").innerHTML = `<p class="lk-title">Enter your PIN</p>
    <div class="lk-dots" aria-label="${LK.buf.length} of ${PIN_LEN} digits entered">${Array.from({length:PIN_LEN},(_,i)=>`<i class="${i<LK.buf.length?"on":""}"></i>`).join("")}</div>
    <p class="lk-msg${!wait&&LK.msg!=="wrong"?" info":""}" role="status">${wait?`Too many wrong attempts. Try again in ${mm}.`:LK.msg==="wrong"?`Wrong PIN. ${left} ${left===1?"chance":"chances"} left.`:`${left} ${left===1?"chance":"chances"}`}</p>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}" ${wait?"disabled":""}>${n}</button>`).join("")}
      <span></span><button data-pin="0" ${wait?"disabled":""}>0</button>
      <button class="pad-sm" data-lk="del" aria-label="Delete" ${wait?"disabled":""}>⌫</button></div>`;
  if(wait) setTimeout(()=>{ if($("lock")){ if(LK.until<=Date.now()){ LK.fails=0; LK.until=0; LK.msg=""; saveFails(); } renderLock(); } },1000);
}
function showLock(){
  LK.buf=""; LK.msg="";
  let L=$("lock");
  if(!L){ L=document.createElement("div"); L.id="lock"; L.setAttribute("role","dialog"); L.setAttribute("aria-modal","true"); L.setAttribute("aria-label","A$AD Protocol lock");
    L.innerHTML = `<div class="lk-brand">${LOGO("lk-logo")}<div class="lk-name">A$AD <span>PROTOCOL</span></div><div class="lk-sub">Private workspace</div></div><div class="lk-body"></div>`;
    document.body.appendChild(L); }
  L.classList.remove("out"); setLocked(true); renderLock();
}
function hideLock(){ const L=$("lock"); if(!L) return; L.classList.add("out"); setLocked(false); setTimeout(()=>{ if(L.classList.contains("out")) L.remove(); },250); }
async function pinComplete(){
  const pin=LK.buf; LK.buf="";
  if(await pinOK(pin)){ LK.fails=0; LK.until=0; LK.msg=""; saveFails(); hideLock(); return; }
  LK.fails++; LK.msg="wrong";
  if(LK.fails>=MAX_TRIES){ LK.until=Date.now()+LOCKOUT_MS; }
  saveFails(); renderLock(); if(navigator.vibrate) try{ navigator.vibrate(120); }catch(_){}
}
function pinKey(k){
  if(LK.until>Date.now()) return;
  if(k==="del"){ LK.buf=LK.buf.slice(0,-1); return renderLock(); }
  if(LK.buf.length>=PIN_LEN) return;
  LK.buf+=k; if(LK.msg==="wrong" && LK.buf.length===1) LK.msg="";
  renderLock(); if(LK.buf.length===PIN_LEN) setTimeout(pinComplete,120);
}
document.addEventListener("click", e=>{
  const t=e.target.closest("#lock button"); if(!t) return; e.stopPropagation();
  if(t.dataset.pin!==undefined) return pinKey(t.dataset.pin);
  if(t.dataset.lk==="del") return pinKey("del");
}, true);
document.addEventListener("keydown", e=>{
  if(!$("lock")||$("lock").classList.contains("out")) return;
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); pinKey(e.key); }
  else if(e.key==="Backspace"){ e.preventDefault(); pinKey("del"); }
});
let hiddenAt=0;
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) hiddenAt=Date.now();
  else if(hiddenAt && Date.now()-hiddenAt>5*60*1000 && pinStored() && !$("lock")) showLock();
});

function results(){
  const q = S.q.trim().toLowerCase();
  if(q.length<2) return `<div class="empty">Type at least two letters to search lines, books, experts and signals.</div>`;
  const has = s => String(s||"").toLowerCase().includes(q);
  const lines = allLines().filter(([m,l])=>has(l[0])||has(l[2])||has(l[3])||has(m.name)).slice(0,24);
  const books = ALL_BOOKS.filter(([b])=>has(b.title)||has(b.author)||has(b.hook)||has(b.big)||(b.ideas||[]).some(([h,p])=>has(h)||has(p)));
  const sigs = [...READ.interest.map(x=>["go",x]),...READ.mixed.map(x=>["warn",x]),...READ.discomfort.map(x=>["stop",x]),...READ.textWarm.map(x=>["go",x]),...READ.textCool.map(x=>["stop",x])].filter(([c,x])=>has(x[0])||has(x[1]));
  const convs = CONVOS.filter(c=>has(c[2])||has(c[3])||has(c[5])||has(c[7])||c[6].some(has)).slice(0,12);
  const minds = MIND.flatMap(t=>(t.points||[]).map((p,i)=>[t,p,i])).filter(([t,p])=>p.some(has)||has(t.name));
  const ints = INTIMACY.flatMap(t=>(t.points||[]).map((p,i)=>[t,p,i])).filter(([t,p])=>p.some(has)||has(t.name));
  if(!lines.length&&!books.length&&!sigs.length&&!ints.length&&!convs.length&&!minds.length) return `<div class="empty">Nothing matches "${esc(S.q)}". Try a shorter word.</div>`;
  let h="";
  if(books.length) h+=`<h3 class="res-h">Library</h3><div class="books">${books.map(([b,s])=>bookBtn(b,s)).join("")}</div>`;
  if(minds.length) h+=`<h3 class="res-h">Mindset</h3><div class="pts">${minds.slice(0,6).map(([t,p,i])=>pointCard(p,i)).join("")}</div>`;
  if(convs.length) h+=`<h3 class="res-h">Conversations</h3><div class="grid">${convs.map(convoCard).join("")}</div>`;
  if(ints.length) h+=`<h3 class="res-h">Intimacy</h3><div class="pts">${ints.slice(0,8).map(([t,p,i])=>pointCard(p,i)).join("")}</div>`;
  if(sigs.length) h+=`<h3 class="res-h">Signals</h3><div class="rules">${sigs.map(([c,x])=>sig(c,x)).join("")}</div>`;
  if(lines.length) h+=`<h3 class="res-h">Lines</h3><div class="grid">${lines.map(([m,l])=>card(l)).join("")}</div>`;
  return h;
}

/* ---- private media gallery (IndexedDB, this device only) ---- */
let dbP=null, mediaURLs=[], mediaArm=null;
function db(){
  if(dbP) return dbP;
  dbP = new Promise((res,rej)=>{ try{ const r=indexedDB.open("asad-media",1);
    r.onupgradeneeded=()=>{ const s=r.result.createObjectStore("media",{keyPath:"id"}); s.createIndex("pid","pid"); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } });
  return dbP;
}
const tx = (mode,fn) => db().then(d=>new Promise((res,rej)=>{ const t=d.transaction("media",mode); const s=t.objectStore("media"); const out=fn(s); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }));
const mediaList = pid => tx("readonly",s=>s.index("pid").getAll(pid));
const mediaDel = id => tx("readwrite",s=>s.delete(id));

function loadGallery(){

  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>'
};
const svgI = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const READ_CHIPS = [["signals","Body language"],["texting","Texting tells"],["rules","Reading rules"]];
const LIB_SEGS = [["psych","Her psychology"],["comm","Communication"],["experts","Experts"]];
const SHELL = { open: new Set(), sideOpen:false };
try{ (JSON.parse(localStorage.getItem("asad-tree")||"null")||["talk","texts-g"]).forEach(k=>SHELL.open.add(k)); }catch(e){ ["talk","texts-g"].forEach(k=>SHELL.open.add(k)); }
try{ if(localStorage.getItem("asad-noside")==="1") document.getElementById("app").classList.add("noside"); }catch(e){}

/* Navigation targets: the single source for the tree, the breadcrumbs and the palette */
function navTargets(){
  const T = [];
  T.push({g:"Home", label:"Home", attrs:'data-go="home"', on:S.view==="home", icon:"home"});
  T.push({g:"Master Mind", label:"Master Mind", n:EPISODES.length, attrs:'data-go="listen"', on:S.view==="listen", icon:"listen"});
  T.push({g:"Talk", label:"Core Code", sub:"Texts", attrs:'data-go="texts" data-chip="core"', on:S.view==="texts"&&S.talkSeg==="texts"&&S.textChip==="core"});
  MODULES.forEach(m=>T.push({g:"Talk", sub:"Texts", label:m.name, n:m.lines.length, attrs:`data-go="texts" data-chip="${m.id}"`, on:S.view==="texts"&&S.talkSeg==="texts"&&S.textChip===m.id}));
  T.push({g:"Talk", sub:"Conversations", label:"All conversations", n:CONVOS.length, attrs:'data-go="texts" data-tseg="convos" data-phase="all"', on:S.view==="texts"&&S.talkSeg==="convos"&&S.phase==="all"});
  PHASES.forEach(([id,n])=>T.push({g:"Talk", sub:"Conversations", label:n, n:CONVOS.filter(c=>c[1]===id).length, attrs:`data-go="texts" data-tseg="convos" data-phase="${id}"`, on:S.view==="texts"&&S.talkSeg==="convos"&&S.phase===id}));
  READ_CHIPS.forEach(([id,n])=>T.push({g:"Read Her", label:n, attrs:`data-go="read" data-rchip="${id}"`, on:S.view==="read"&&S.readChip===id}));
  INTIMACY.forEach(t=>T.push({g:"Intimacy", label:t.name, attrs:`data-go="intimacy" data-ichip="${t.id}"`, on:S.view==="intimacy"&&S.intChip===t.id}));
  MIND.forEach(m=>T.push({g:"Mindset", label:m.name, attrs:`data-go="mind" data-mchip="${m.id}"`, on:S.view==="mind"&&S.mindChip===m.id}));
  T.push({g:"Her", label:"Pipeline", n:profiles.length, attrs:'data-pipeline="1"', on:S.view==="her"&&!S.herId});
  profiles.forEach(p=>T.push({g:"Her", label:p.name||"Unnamed", attrs:`data-her="${p.id}"`, on:S.view==="her"&&S.herId===p.id, kind:"Profile"}));
  LIB_SEGS.forEach(([id,n])=>T.push({g:"Library", label:n, n:LIB[id].length, attrs:`data-go="library" data-seg="${id}"`, on:S.view==="library"&&S.libSeg===id}));
  T.push({g:"Vault", label:"My Vault", n:vault.length, attrs:'data-go="vault"', on:S.view==="vault", icon:"vault"});
  return T;
}
const TREE_GROUPS = [["Talk","talk","texts"],["Read Her","read","read"],["Intimacy","intimacy","intimacy"],["Mindset","mind","mind"],["Her","her","her"],["Library","library","library"]];
function navTree(){
  const T = navTargets();
  const item = t => `<button class="ti" ${t.attrs} ${t.on?'aria-current="page"':""}>${t.icon?svgI(t.icon):""}<span class="tl">${esc(t.label)}</span>${t.n!==undefined?`<span class="tn">${t.n}</span>`:""}</button>`;
  const grp = (key,label,inner,open) => `<details data-k="${key}" ${open?"open":""}><summary>${label}</summary><div class="kids">${inner}</div></details>`;
  let h = `<div class="tree-label">Workspace</div>` + item(Object.assign(T[0],{icon:"home"})).replace('class="ti"','class="ti top"') + item(T.find(t=>t.g==="Master Mind")).replace('class="ti"','class="ti top"');
  TREE_GROUPS.forEach(([g,key,view])=>{
    const items = T.filter(t=>t.g===g);
    let inner;
    if(g==="Talk"){
      inner = grp("texts-g","Texts",items.filter(t=>t.sub==="Texts").map(item).join(""), SHELL.open.has("texts-g")||(S.view==="texts"&&S.talkSeg==="texts"))
            + grp("convos-g","Conversations",items.filter(t=>t.sub==="Conversations").map(item).join(""), SHELL.open.has("convos-g")||(S.view==="texts"&&S.talkSeg==="convos"));
    } else inner = items.map(item).join("");
    h += grp(key, `${svgI(view)}${g}`, inner, SHELL.open.has(key)||S.view===view);
  });
  h += `<div class="tree-label">Personal</div>` + item(T.find(t=>t.g==="Vault")).replace('class="ti"','class="ti top"')
     + `<button class="ti top" data-palette="1">${svgI("search")}<span class="tl">Search everything</span></button>`;
  return h;
}
function crumbs(){
  const C = [];
  const mod = MODULES.find(m=>m.id===S.textChip);
  if(S.view==="home") C.push(["Home"]);
  if(S.view==="texts"){ C.push(["Talk",'data-go="texts"']);
    if(S.talkSeg==="convos"){ C.push(["Conversations",'data-go="texts" data-tseg="convos" data-phase="all"']); const ph=PHASES.find(x=>x[0]===S.phase); C.push([ph?ph[1]:"All"]); }
    else { C.push(["Texts",'data-go="texts" data-chip="core"']); C.push([S.textChip==="core"?"Core Code":(mod?mod.name:"")]); } }
  if(S.view==="read"){ C.push(["Read Her",'data-go="read"']); C.push([(READ_CHIPS.find(x=>x[0]===S.readChip)||[0,""])[1]]); }
  if(S.view==="intimacy"){ C.push(["Intimacy",'data-go="intimacy"']); C.push([(INTIMACY.find(x=>x.id===S.intChip)||{name:""}).name]); }
  if(S.view==="her"){ const p=curP(); C.push(["Her",'data-pipeline="1"']);
    if(p){ C.push([p.name||"Unnamed",`data-her="${p.id}"`]); C.push([{tracker:"Tracker",profile:"Profile",revival:"Revival",read:"Her read"}[S.herTab]||""]); } else C.push(["Pipeline"]); }
  if(S.view==="library"){ C.push(["Library",'data-go="library"']); C.push([(LIB_SEGS.find(x=>x[0]===S.libSeg)||[0,""])[1]]); }
  if(S.view==="mind"){ C.push(["Mindset",'data-go="mind"']); C.push([(MIND.find(x=>x.id===S.mindChip)||{name:""}).name]); }
  if(S.view==="listen"){ C.push(["Master Mind"]); }
  if(S.view==="vault") C.push(["My Vault"]);
  if(S.view==="search") C.push(["Search"]);
  return C.map((c,i)=> i===C.length-1 ? `<span class="cur">${esc(c[0])}</span>` : `<button ${c[1]||""} class="${i<C.length-2?"hide-sm":""}">${esc(c[0])}</button><span class="sep ${i<C.length-2?"hide-sm":""}">/</span>`).join("");
}
function renderShell(){
  const tr=$("tree"); if(tr){ const st=tr.scrollTop; tr.innerHTML=navTree(); tr.scrollTop=st; }
  const cr=$("crumbs"); if(cr) cr.innerHTML=crumbs();
  const rib=$("ribbon"); if(rib) rib.innerHTML = TABS.map(([id,n])=>`<button class="rb" data-go="${id}" title="${n}" aria-label="${n}" ${S.view===id?'aria-current="page"':''}>${svgI(id)}</button>`).join("")
    + `<button class="rb" data-go="library" title="Library" aria-label="Library" ${S.view==="library"?'aria-current="page"':''}>${svgI("library")}</button>`
    + `<button class="rb" data-go="mind" title="Mindset" aria-label="Mindset" ${S.view==="mind"?'aria-current="page"':''}>${svgI("mind")}</button>`
    + `<button class="rb" data-go="vault" title="My Vault" aria-label="My Vault" ${S.view==="vault"?'aria-current="page"':''}>${svgI("vault")}</button><span class="sp"></span>`
    + `<button class="rb" data-palette="1" title="Search or jump to (Ctrl K)" aria-label="Search or jump to">${svgI("search")}</button>`
    + `<button class="rb" data-themebtn="1" title="Light or dark" aria-label="Switch light or dark mode"><svg class="sun" viewBox="0 0 24 24">${ICON.sun}</svg><svg class="moon" viewBox="0 0 24 24">${ICON.moon}</svg></button>`
    + `<button class="rb" data-lockapp="1" title="Lock" aria-label="Lock app">${svgI("lock")}</button>`;
  const stt=$("status"); if(stt){ const act=profiles.filter(p=>!p.outcome).length; stt.innerHTML=`<span><b>●</b> Local & private</span><span>${act} active</span><span>${allLines().length} lines</span><span>${CONVOS.length} conversations</span><span>v5.3</span>`; }
}
function setSide(open){ SHELL.sideOpen=open; $("side").classList.toggle("open",open); $("sideScrim").classList.toggle("on",open); }
const isDesk = () => matchMedia("(min-width:1000px)").matches;
document.addEventListener("toggle", e=>{ const d=e.target; if(!d.matches||!d.matches(".tree details")) return; const k=d.dataset.k; if(d.open) SHELL.open.add(k); else SHELL.open.delete(k); try{ localStorage.setItem("asad-tree",JSON.stringify([...SHELL.open])); }catch(_){} }, true);

/* Command palette */
let PAL = {items:[], sel:0};
function palItems(q){
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const T = navTargets().map(t=>({k:t.kind||t.g, label:(t.sub?t.sub+" › ":"")+t.label, attrs:t.attrs}));
  ALL_BOOKS.forEach(([b,seg])=>T.push({k:seg==="experts"?"Expert":"Book", label:b.title+" · "+b.author, attrs:`data-book="${b.id}"`}));
  T.push({k:"Action", label:"Add a new connection", attrs:'data-go="her" data-newher="1"'});
  T.push({k:"Action", label:"Lock the app", attrs:'data-lockapp="1"'});
  T.push({k:"Action", label:"Switch light or dark mode", attrs:'data-themebtn="1"'});
  const match = t => words.every(w=>(t.k+" "+t.label).toLowerCase().includes(w));
  let out = words.length ? T.filter(match) : T.filter(t=>["Home","Master Mind","Talk","Read Her","Intimacy","Mindset","Her","Library","Vault"].includes(t.k)).slice(0,14);
  if(words.length) out.unshift({k:"Search", label:`Search all content for “${q}”`, attrs:`data-go="search" data-q="${esc(q)}"`});
  return out.slice(0,40);
}
function renderPal(){
  const L=$("palList"); if(!L) return;
  L.innerHTML = PAL.items.length ? PAL.items.map((t,i)=>`<button class="pi${i===PAL.sel?" sel":""}" role="option" aria-selected="${i===PAL.sel}" ${t.attrs}><span class="pk">${esc(t.k)}</span><span class="pl">${esc(t.label)}</span></button>`).join("") : `<div class="pal-empty">Nothing found.</div>`;
  const s=L.querySelector(".sel"); if(s) s.scrollIntoView({block:"nearest"});
}
function openPal(){ const P=$("palette"); P.hidden=false; const i=$("palIn"); i.value=""; PAL.items=palItems(""); PAL.sel=0; renderPal(); setSide(false); setTimeout(()=>i.focus(),0); }
function closePal(){ const P=$("palette"); if(P && !P.hidden){ P.hidden=true; } }
document.addEventListener("input", e=>{ if(e.target.id!=="palIn") return; PAL.items=palItems(e.target.value.trim()); PAL.sel=0; renderPal(); });
document.addEventListener("keydown", e=>{
  if($("lock") && !$("lock").classList.contains("out")) return;
  if((e.ctrlKey||e.metaKey) && (e.key==="k"||e.key==="K"||e.key==="p"||e.key==="P")){ e.preventDefault(); openPal(); return; }
  const P=$("palette"); if(P && !P.hidden){
    if(e.key==="Escape"){ closePal(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); PAL.sel=Math.min(PAL.sel+1,PAL.items.length-1); renderPal(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); PAL.sel=Math.max(PAL.sel-1,0); renderPal(); }
    if(e.key==="Enter"){ e.preventDefault(); const b=$("palList").querySelector(".pi.sel"); if(b) b.click(); }
    return;
  }
  if(e.key==="Escape" && SHELL.sideOpen) setSide(false);
});
/* Shell clicks run first (capture) so they can close the drawer/palette before the page re-renders */
document.addEventListener("click", e=>{
  const t=e.target.closest("button,[data-closeside],[data-closepal]"); if(!t) return;
  if(t.dataset.closepal){ closePal(); return; }
  if(t.dataset.closeside){ setSide(false); return; }
  if(t.id==="sideBtn"){ if(isDesk()){ const a=$("app"); a.classList.toggle("noside"); try{ localStorage.setItem("asad-noside",a.classList.contains("noside")?"1":"0"); }catch(_){} } else setSide(!SHELL.sideOpen); return; }
  if(t.dataset.palette){ e.stopPropagation(); openPal(); return; }
  if(t.dataset.q!==undefined) S.q=t.dataset.q;
  if(t.dataset.pipeline){ e.stopPropagation(); S.herId=null; closePal(); if(!isDesk()) setSide(false); if(S.view!=="her") go("her"); else { render(); window.scrollTo({top:0}); } return; }
  if(t.closest("#palette .pal-list")) closePal();
  if(t.closest("#side") && !isDesk()) setSide(false);
}, true);

/* Background: six cyberpunk phantom scenes, one every 2 minutes, crossfaded */
(function bgRotate(){
  const A=$("bgA"), B=$("bgB"); if(!A||!B) return;
  const cache = {}; const url = i => cache[i] || (cache[i]=bgURL(i));
  const slot = () => Math.floor(Date.now()/120000) % BG_SCENES.length;
  let cur = slot(), front = A;
  A.style.backgroundImage = url(cur); A.classList.add("on");
  setInterval(()=>{ const n=slot(); if(n===cur) return; cur=n; const back = front===A?B:A; back.style.backgroundImage=url(n); back.classList.add("on"); front.classList.remove("on"); front=back; }, 5000);
})();

/* No zooming: fixed scale, no pinch, no double-tap zoom */
(function noZoom(){
  const content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
  let m=document.querySelector('meta[name="viewport"]'); if(!m){ m=document.createElement("meta"); m.name="viewport"; document.head.appendChild(m); }
  m.setAttribute("content",content);
  ["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  document.addEventListener("touchmove",e=>{ if(e.touches && e.touches.length>1) e.preventDefault(); },{passive:false});
  document.addEventListener("wheel",e=>{ if(e.ctrlKey) e.preventDefault(); },{passive:false});
})();

const _lg=LOGO(); $("sideBrand").innerHTML=_lg+'A$AD <span>PROTOCOL</span>'; $("tbLogo").innerHTML=LOGO();
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(VIEWS.includes(h)&&h!==S.view){ S.view=h; render(); } });
render();
showLock();
